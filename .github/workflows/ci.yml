name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test with coverage
        run: pytest --cov=src/clinical_informatics --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Regenerate canonical project outputs
        run: python -m clinical_informatics.build_project --seed 42

      - name: Run relational practice workflow
        run: python notebooks/relational_data_practice.py

      - name: Confirm generated artefacts are current
        run: git diff --exit-code -- data/synthetic data/data_dictionary.md "outputs/*.csv" "outputs/*.md"
