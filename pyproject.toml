[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-informatics-demo"
version = "0.1.0"
description = "Synthetic clinical trial operations data model, validation checks and dashboard."
requires-python = ">=3.11,<3.14"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "matplotlib>=3.8,<4",
  "plotly>=5.22,<7",
  "streamlit>=1.36,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
clinical-informatics-build = "clinical_informatics.build_project:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
